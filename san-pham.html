<!DOCTYPE html>
<html lang="vi">

<head>
    <meta name="robots" content="noindex" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Danh mục sản phẩm Gas Lê Minh - Tổng hợp các sản phẩm gas chính hãng, bếp gas, và phụ kiện với giá ưu đãi.">
    <title>Tất cả sản phẩm | Gas Lê Minh</title>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css?v=1784900413271">
    <style>
        .category-sidebar ul li a.active {
            color: var(--color-accent);
            background-color: var(--color-primary);
            padding-left: 25px;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
    <link rel="stylesheet" href="css/responsive.css?v=9999999999999">
    <link rel="icon" type="image/png" href="assets/logo/logo_gas.png">
</head>

<body>
    <h1
        style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">
        Tất cả sản phẩm</h1>

    <site-header></site-header>
    <script defer src="/components/header.js?v=5"></script>



    <div class="container page-content">
        <div class="content-grid">
            <!-- Sidebar -->
            <div class="category-sidebar">
                <div class="sidebar-title">
                    <i class="fa-solid fa-list-ul"></i>
                    <strong>Danh mục sản phẩm</strong>
                </div>
                <ul class="category-list" id="dynamicCategoryList">
                    <!-- Dynamic categories rendered by JS -->
                </ul>
            </div>

            <!-- Product Area -->
            <div class="product-area">
                <div class="section-header-full header-search-only" style="position: relative;">
                    <!-- Nút toggle sidebar trên mobile -->
                    <button id="sidebarToggleBtn" class="btn-sidebar-toggle" aria-label="Toggle Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="section-search search-flex">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" placeholder="Tìm kiếm..." class="search-input">
                        <button class="btn-search">
                            <span class="btn-search-text">Tìm kiếm</span>
                            <i class="fa-solid fa-magnifying-glass btn-search-icon" style="display: none;"></i>
                        </button>
                    </div>
                    <div class="sort-by">
                        <div class="custom-dropdown" id="sortDropdown">
                            <div class="dropdown-selected">
                                <span>Sắp xếp: Mới nhất</span> <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <ul class="dropdown-options">
                                <li class="active">Mới nhất</li>
                                <li>Giá: Thấp đến Cao</li>
                                <li>Giá: Cao đến Thấp</li>
                                <li>Bán chạy nhất</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Product Sections rendered by JS -->
                <div id="dynamicProductSections">
                    <!-- Products load here -->
                </div>

                <div class="pagination" id="paginationWrapper" style="display: none;">
                    <!-- Pagination buttons -->
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <site-footer></site-footer>




    <!-- JS -->
    <script defer src="/js/product-db.js?v=5"></script>
    <script defer src="/components/footer.js?v=5"></script>
    <script defer src="/js/main.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ProductDB !== 'undefined') {
                await ProductDB.initAsync();
            }
            const ITEMS_PER_PAGE = 12;
            let currentPage = 1;
            let currentSearch = '';

            // Lấy ID danh mục từ URL nếu có
            const urlParams = new URLSearchParams(window.location.search);
            let currentCategory = urlParams.get('category') ? parseInt(urlParams.get('category')) : '';

            let currentSort = 'newest';

            function updateSEO(category) {
                let metaDesc = document.querySelector('meta[name="description"]');
                if (category) {
                    if (metaDesc && category.seoDesc) {
                        metaDesc.setAttribute('content', category.seoDesc);
                    }
                    document.title = category.name + " | Gas Lê Minh";
                } else {
                    if (metaDesc) {
                        metaDesc.setAttribute('content', "Danh mục sản phẩm Gas Lê Minh - Tổng hợp các sản phẩm gas chính hãng, bếp gas, và phụ kiện với giá ưu đãi.");
                    }
                    document.title = "Tất cả sản phẩm | Gas Lê Minh";
                }
            }

            // 1. Render Sidebar Categories
            function renderSidebar() {
                const list = document.getElementById('dynamicCategoryList');
                if (!list) return;

                const categories = ProductDB.getCategories();

                list.innerHTML = categories.map(cat => {
                    const count = ProductDB.getProductCountByCategory(cat.id);
                    const isActive = currentCategory === cat.id ? 'class="active"' : '';
                    return `
                        <li><a href="/${cat.slug}" data-cat-id="${cat.id}" ${isActive}>
                            ${cat.name} 
                            <span class="sidebar-count">${count}</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </a></li>
                    `;
                }).join('');

                // Add "All Products" option at top
                list.insertAdjacentHTML('afterbegin', `
                    <li><a href="/san-pham" data-cat-id="all" ${currentCategory === '' ? 'class="active"' : ''}>
                        Tất cả sản phẩm
                        <span class="sidebar-count">${ProductDB.getAll().length}</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a></li>
                `);

                // Add click events for SPA feel
                list.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        list.querySelectorAll('a').forEach(l => l.classList.remove('active'));
                        link.classList.add('active');

                        const catId = link.getAttribute('data-cat-id');
                        currentCategory = catId === 'all' ? '' : parseInt(catId);
                        currentPage = 1; // Reset to page 1

                        // Update URL without reload
                        history.pushState(null, '', link.getAttribute('href'));

                        if (currentCategory !== '') {
                            const catObj = ProductDB.getCategoryById(currentCategory);
                            updateSEO(catObj);
                        } else {
                            updateSEO(null);
                        }

                        renderProducts();

                        // Close mobile sidebar if open
                        const sidebar = document.querySelector('.category-sidebar');
                        if (sidebar) sidebar.classList.remove('mobile-active');

                        // Scroll to top of products with small offset
                        setTimeout(() => {
                            const titleWrapper = document.querySelector('.category-section-title-wrapper');
                            if (titleWrapper) {
                                // Scroll to element with 80px offset for header/padding
                                const y = titleWrapper.getBoundingClientRect().top + window.scrollY - 80;
                                window.scrollTo({ top: y, behavior: 'smooth' });
                            }
                        }, 10);
                    });
                });
            }

            // 2. Render Products
            function renderProducts() {
                const container = document.getElementById('dynamicProductSections');
                if (!container) return;

                // Fetch data
                let products = [];
                if (currentSearch) {
                    products = ProductDB.search(currentSearch);
                } else if (currentCategory) {
                    products = ProductDB.getByCategory(currentCategory);
                } else {
                    products = ProductDB.getAll();
                }

                // Apply Sort
                if (currentSort === 'price-asc') {
                    products.sort((a, b) => ProductDB.getDiscountedPrice(a) - ProductDB.getDiscountedPrice(b));
                } else if (currentSort === 'price-desc') {
                    products.sort((a, b) => ProductDB.getDiscountedPrice(b) - ProductDB.getDiscountedPrice(a));
                } else if (currentSort === 'best-selling') {
                    products.sort((a, b) => (b.featured === a.featured) ? 0 : b.featured ? 1 : -1);
                } // newest is default (no sort since DB is naturally ordered or could be reversed)

                // Pagination
                const totalItems = products.length;
                const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

                // Ensure current page is valid
                if (currentPage > totalPages) currentPage = totalPages || 1;

                const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
                const paginatedProducts = products.slice(startIdx, startIdx + ITEMS_PER_PAGE);

                // Build HTML
                if (paginatedProducts.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 50px 20px;">
                            <i class="fa-solid fa-box-open" style="font-size: 48px; color: var(--color-gray-400); margin-bottom:15px;"></i>
                            <h3 style="color: var(--color-gray-700)">Không tìm thấy sản phẩm nào!</h3>
                        </div>
                    `;
                    document.getElementById('paginationWrapper').style.display = 'none';
                    return;
                }

                const gridHtml = `
                    <div class="category-section" style="margin-bottom: 30px;">
                        <div class="category-section-title-wrapper">
                            <h2 class="category-section-title" style="color: var(--color-primary-dark); margin: 0; font-size: 1.5rem;">
                                ${currentCategory ? ProductDB.getCategoryName(currentCategory) : (currentSearch ? 'Kết quả tìm kiếm' : 'Tất cả sản phẩm')}
                            </h2>
                            <span class="category-count" style="color: var(--color-gray-600); font-weight: 500; font-size: 1rem;">(${totalItems} sản phẩm)</span>
                        </div>
                        <div class="products-grid">
                            ${paginatedProducts.map(p => {
                    const discountedPrice = ProductDB.getDiscountedPrice(p);
                    const hasDiscount = p.discount > 0;
                    return `
                                    <div class="product-card">
                                        ${p.badgeText ? `<div class="product-badge" style="background-color: ${p.badgeColor || '#ef4444'}; color: white;">${p.badgeText}</div>` : (hasDiscount ? `<div class="product-badge badge-discount">Giảm ${p.discount}%</div>` : (p.onSale ? '<div class="product-badge badge-discount" style="background-color: var(--color-accent); color: white;">Ưu đãi</div>' : (p.featured ? '<div class="product-badge badge-new">Mới</div>' : '')))}
                                        <div class="product-img">
                                            <a href="/san-pham/${p.slug || p.id}"><img loading="lazy" src="${p.image}" alt="${p.name}"></a>
                                        </div>
                                        <div class="product-info">
                                            <h3><a href="/san-pham/${p.slug || p.id}" style="color: inherit; text-decoration: none;">${p.name}</a></h3>
                                            <div class="product-price">
                                                <span class="price-current">${ProductDB.formatPrice(discountedPrice)}</span>
                                                ${hasDiscount ? `<span class="price-old">${ProductDB.formatPrice(p.price)}</span>` : ''}
                                            </div>
                                            <div class="product-actions">
                                                <button class="buy-now-btn" onclick="window.location.href='/san-pham/${p.slug || p.id}'">Mua ngay</button>
                                                <button class="add-to-cart-btn"><i class="fa-solid fa-cart-plus"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                }).join('')}
                        </div>
                    </div>
                `;

                container.innerHTML = gridHtml;

                // Render Pagination controls
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                const wrapper = document.getElementById('paginationWrapper');

                if (totalPages <= 1) {
                    wrapper.style.display = 'none';
                    return;
                }

                wrapper.style.display = 'flex';
                let html = '';

                // Prev btn
                html += `<button class="page-btn" ${currentPage === 1 ? 'disabled style="opacity:0.5"' : `onclick="changePage(${currentPage - 1})"`}><i class="fa-solid fa-chevron-left"></i></button>`;

                // Pages
                for (let i = 1; i <= totalPages; i++) {
                    html += `<button class="page-num ${currentPage === i ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }

                // Next btn
                html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled style="opacity:0.5"' : `onclick="changePage(${currentPage + 1})"`}><i class="fa-solid fa-chevron-right"></i></button>`;

                wrapper.innerHTML = html;
            }

            window.changePage = function (page) {
                currentPage = page;
                renderProducts();
                window.scrollTo({ top: 300, behavior: 'smooth' });
            };

            // 3. Search and Sort Handlers
            const searchInput = document.querySelector('.search-input');
            const searchBtn = document.querySelector('.btn-search');

            function handleSearch() {
                if (searchInput) {
                    currentSearch = searchInput.value.trim();
                    currentCategory = ''; // clear category filter
                    currentPage = 1;

                    // Reset sidebar active state
                    document.querySelectorAll('.category-list a').forEach(l => l.classList.remove('active'));

                    renderProducts();
                }
            }

            if (searchBtn) searchBtn.addEventListener('click', handleSearch);
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
            }

            // Custom Dropdown for Sorting
            const sortOptions = document.querySelectorAll('.dropdown-options li');
            const dropdownSelected = document.querySelector('.dropdown-selected span');

            sortOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    setTimeout(() => {
                        const val = opt.textContent.trim();
                        dropdownSelected.textContent = 'Sắp xếp: ' + val;

                        if (val.includes('Mới nhất')) currentSort = 'newest';
                        else if (val.includes('Thấp đến Cao')) currentSort = 'price-asc';
                        else if (val.includes('Cao đến Thấp')) currentSort = 'price-desc';
                        else if (val.includes('Bán chạy nhất')) currentSort = 'best-selling';

                        currentPage = 1;
                        renderProducts();
                    }, 10);
                });
            });

            // Toggle sidebar for mobile
            const sidebarBtn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.querySelector('.category-sidebar');
            if (sidebarBtn && sidebar) {
                sidebarBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.toggle('mobile-active');
                });
                document.addEventListener('click', (e) => {
                    if (!sidebar.contains(e.target) && !sidebarBtn.contains(e.target)) {
                        sidebar.classList.remove('mobile-active');
                    }
                });
            }

            // Init
            // Parse initial URL for category
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length >= 1) {
                // Kiểm tra xem slug có phải là trang HTML hay không
                const slug = pathSegments[0].replace('.html', '');
                // Bỏ qua nếu là các trang chung
                if (slug !== 'san-pham' && slug !== 'trang-chu' && slug !== 'lien-he' && slug !== 've-chung-toi' && slug !== 'tin-tuc') {
                    const cat = ProductDB.getCategoryBySlug(slug);
                    if (cat) {
                        currentCategory = cat.id;
                        updateSEO(cat);
                    } else {
                        updateSEO(null);
                    }
                } else {
                    updateSEO(null);
                }
            } else {
                updateSEO(null);
            }
            renderSidebar();
            renderProducts();
        });
    </script>


    <!-- Floating Contact Widgets -->
    <div class="floating-contact-wrapper">
        <a href="tel:0901234567" class="float-btn float-hotline" title="G?i Ngay">
            <i class="fa-solid fa-phone"></i>
        </a>
        <a href="https://zalo.me/0901234567" target="_blank" class="float-btn float-zalo" title="Chat Zalo">
            <img src="https://stc-zaloprofile.zdn.vn/pc/v1/images/zalo_sharelogo.png" alt="Zalo"
                onerror="this.src='https://cdn.haitrieu.com/wp-content/uploads/2022/01/Logo-Zalo-Arc.png'">
        </a>
    </div>
</body>

</html>
