# Cấu hình NGINX cho Deli-Gas Ecommerce

# Sửa lỗi đường dẫn tương đối (Fix lỗi mất ảnh, css, js, html khi trình duyệt chạy file JS cũ)
rewrite ^/(?:chi-tiet-san-pham|chi-tiet-tin-tuc)/(assets|css|js|components)/(.*)$ /$1/$2 permanent;
rewrite ^/(?:chi-tiet-san-pham|chi-tiet-tin-tuc)/([a-zA-Z0-9_-]+\.html)$ /$1 permanent;

# Fix logo: Tự động chuyển hướng các link logo cũ/lỗi về logo chuẩn
rewrite "^/assets/logo/logo_primary_gas - Copy\.png$" /assets/logo/logo_primary_gas.png permanent;
rewrite ^/assets/logo/logo_gas\.png$ /assets/logo/logo_primary_gas.png permanent;

# Bắt đường dẫn SEO của chi-tiet-san-pham và chi-tiet-tin-tuc
rewrite ^/chi-tiet-san-pham/([^/]+)$ /chi-tiet-san-pham.html?slug=$1 last;
rewrite ^/chi-tiet-tin-tuc/([^/]+)$ /chi-tiet-tin-tuc.html?slug=$1 last;

# Bắt các slug danh mục để chuyển về trang sản phẩm
rewrite ^/(gas-saigon-petro|gas-petrolimex|gas-gia-dinh|gas-thu-duc|gas-elf|bep-hong-ngoai|bep-gas-am|phu-kien-van-day|combo-khuyen-mai)$ /san-pham.html last;

# Ẩn đuôi .html cho các trang thông thường
if (!-e $request_filename) {
    rewrite ^/(.*)$ /$1.html last;
}
