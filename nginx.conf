# Bắt buộc trang chủ là index.html khi vào thẳng domain /
rewrite ^/$ /index.html last;

# Sửa lỗi đường dẫn tương đối (Fix lỗi mất ảnh, css, js, html khi trình duyệt chạy file JS cũ)
rewrite ^/(?:san-pham|chi-tiet-san-pham|chi-tiet-tin-tuc|tin-tuc)/(assets|css|js|components)/(.*)$ /$1/$2 permanent;
rewrite ^/(?:san-pham|chi-tiet-san-pham|chi-tiet-tin-tuc|tin-tuc)/([a-zA-Z0-9_-]+\.html)$ /$1 permanent;

# Bắt các trang tĩnh cơ bản (ẩn đuôi .html)
rewrite ^/(index|ve-chung-toi|lien-he|tat-ca-bai-viet|gio-hang|chuyen-muc-an-toan-gas|admin|quan-tri)/?$ /$1.html last;

# Bắt các slug danh mục để chuyển về trang sản phẩm
rewrite ^/(gas-saigon-petro|gas-petrolimex|gas-gia-dinh|gas-thu-duc|gas-elf|bep-hong-ngoai|bep-gas-am|phu-kien-van-day|combo-khuyen-mai)$ /san-pham.html last;

# Bắt đường dẫn SEO cấp 1 (Sản phẩm & Tin tức dùng chung 1 cấp)
rewrite ^/([^/\.]+)$ /router.php?slug=$1 last;

# Fix đổi tên file ảnh logo cũ sang mới
rewrite "^/assets/logo/logo_primary_gas - Copy\.png$" /assets/logo/logo_gas.png permanent;
rewrite ^/assets/logo/logo_primary_gas\.png$ /assets/logo/logo_gas.png permanent;

# Ẩn đuôi .html cho các trang thông thường (dự phòng)
if (!-e $request_filename) {
    rewrite ^/(.*)$ /$1.html last;
}
